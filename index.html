<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>旅ナビ</title>
<meta name="description" content="旅程・イヤホン専用アラーム・天気・乗換・地図をひとつにまとめた旅のアプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅ナビ">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- ロード画面 -->
<div id="splash" aria-hidden="true">
  <div class="splash-logo"><img src="icons/icon-512.png" alt=""></div>
  <div class="splash-title">旅ナビ</div>
  <div class="splash-bar"><span></span></div>
</div>

<div id="app">
  <main id="views">
    <section class="view" id="view-home" data-tab="home"></section>
    <section class="view" id="view-trip" data-tab="trip"></section>
    <section class="view" id="view-alarm" data-tab="alarm"></section>
    <section class="view" id="view-transit" data-tab="transit"></section>
    <section class="view" id="view-settings" data-tab="settings"></section>
  </main>

  <nav id="tabbar">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
    <button data-tab="trip"><svg viewBox="0 0 24 24"><path d="M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm2 0h4V5h-4zM8 9v9m8-9v9" fill-rule="evenodd"/></svg><span>旅程</span></button>
    <button data-tab="alarm"><svg viewBox="0 0 24 24"><path d="M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm0-12v4.5l3 2M4 4.5 6.5 2.5M20 4.5l-2.5-2"/></svg><span>アラーム</span></button>
    <button data-tab="transit"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5V4l-6 2.5zm0 0v14m6-11.5v14"/></svg><span>交通</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.4-2.2.1-1.3-.1-1.3 2-1.6-2-3.4-2.4 1a8 8 0 0 0-2.2-1.3L14.5 3h-4l-.4 2.5a8 8 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.6-.1 1.3.1 1.3-2 1.6 2 3.4 2.4-1a8 8 0 0 0 2.2 1.3l.4 2.5h4l.4-2.5a8 8 0 0 0 2.2-1.3l2.4 1 2-3.4z"/></svg><span>設定</span></button>
  </nav>
</div>

<!-- 重ねて出す画面（シート・押し出しページ・アラーム鳴動・おやすみ画面） -->
<div id="layers"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
